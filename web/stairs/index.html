<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Конструктор лестниц</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #eee; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }

  #panel {
    position: absolute; top: 15px; left: 15px; z-index: 20;
    width: 330px; max-height: calc(100% - 30px); overflow-y: auto;
    background: rgba(20, 22, 30, 0.93); backdrop-filter: blur(15px);
    padding: 16px 18px; border-radius: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.18);
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .25s ease, opacity .25s ease;
  }
  #panel.collapsed { transform: translateX(-110%); opacity: 0; pointer-events: none; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; }
  h3 { margin: 0; font-weight: 500; font-size: 1.15rem; color: #fff; }
  #panelClose { display: none; background: transparent; color: #aaa; font-size: 1.2rem; padding: 4px 8px; margin: 0; box-shadow: none; }

  select, input[type=number] {
    width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid #4b5563;
    background: #1f2937; color: #fff; font-size: 0.95rem; outline: none; font-family: inherit;
  }
  select:focus, input:focus { border-color: #ffaa00; box-shadow: 0 0 8px #ffaa0088; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: #ffaa00; }
  #paramsContainer { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row label { flex: 0 0 112px; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; color: #ddd; }
  .row .unit { flex: 0 0 auto; font-size: 0.7rem; color: #888; min-width: 22px; }
  .color-dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }

  .btns { display: flex; gap: 8px; }
  button {
    background: #ffaa00; border: none; color: #000; font-weight: bold; font-family: inherit;
    padding: 12px; border-radius: 14px; font-size: 1rem; cursor: pointer; transition: 0.2s;
  }
  #buildBtn { flex: 1; }
  #resetBtn { background: #374151; color: #ddd; font-weight: 500; font-size: 0.85rem; }
  @media (hover: hover) { #buildBtn:hover { background: #ffbb22; box-shadow: 0 0 15px #ffaa00aa; } }

  #resultsBox {
    background: #1f2937; border-radius: 14px; padding: 12px; font-size: 0.85rem;
    display: flex; flex-direction: column; gap: 6px;
  }
  .res-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .res-label { color: #aaa; }
  .res-value { font-weight: 600; text-align: right; }
  .res-value .dim { color: #888; font-weight: 400; font-size: 0.75rem; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.68rem; font-weight: 600; margin-left: 4px; }
  .ok { background: #166534; color: #dcfce7; }
  .warn { background: #854d0e; color: #fef9c3; }
  .error { background: #991b1b; color: #fee2e2; }
  #warnBox {
    background: rgba(133,77,14,0.35); border: 1px solid #854d0e; border-radius: 12px;
    padding: 8px 10px; font-size: 0.78rem; color: #fde68a; display: flex; flex-direction: column; gap: 4px;
  }
  .legend { font-size: 0.68rem; color: #aaa; display: flex; flex-wrap: wrap; gap: 8px; }

  #views2d {
    position: absolute; right: 15px; top: 15px; z-index: 15;
    display: none; flex-direction: column; gap: 10px;
    max-height: calc(100% - 30px); overflow-y: auto;
  }
  #views2d.show { display: flex; }
  .canvas2d {
    background: rgba(30, 30, 40, 0.85); border-radius: 16px; padding: 4px;
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18);
  }
  .canvas2d canvas { width: 300px; height: 200px; }

  #fab { position: absolute; top: 15px; right: 15px; z-index: 30; display: none; flex-direction: column; gap: 10px; }
  #fab button {
    width: 48px; height: 48px; padding: 0; border-radius: 16px; font-size: 1.3rem;
    background: rgba(20,22,30,0.9); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
  }
  #fab button.active { background: #ffaa00; color: #000; }

  #info {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 10;
    color: #fff; background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px;
    font-size: 0.75rem; pointer-events: none; text-align: center; white-space: nowrap;
  }
  #summary { font-weight: 600; }
  .label3d { font-weight: bold; font-size: 13px; text-shadow: 1px 1px 3px #000, 0 0 2px #000; white-space: nowrap; }

  #glError {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 30px; text-align: center; color: #fca5a5; font-size: 0.95rem;
  }
  #glError[hidden] { display: none; }

  /* ---------- Телефон / узкий экран ---------- */
  @media (max-width: 900px) {
    #fab { display: flex; top: calc(12px + env(safe-area-inset-top)); right: 12px; }
    #panel {
      top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 72px; width: auto;
      max-height: calc(100% - 80px); padding: 14px; border-radius: 18px;
    }
    #panelClose { display: block; }
    .row label { flex-basis: 104px; }
    #views2d {
      top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 72px;
      max-height: calc(100% - 80px); align-items: stretch;
    }
    .canvas2d canvas { width: 100%; height: auto; aspect-ratio: 3 / 2; }
    #info { bottom: calc(12px + env(safe-area-inset-bottom)); font-size: 0.72rem; max-width: calc(100% - 24px); white-space: normal; }
    .label3d { font-size: 11px; }
  }
  @media (max-width: 900px) and (orientation: landscape) {
    #panel, #views2d { right: auto; width: 360px; }
  }
</style>
</head>
<body>
  <div id="panel">
    <div class="panel-head">
      <h3>🏗️ Конструктор лестниц</h3>
      <button id="panelClose" title="Скрыть">✕</button>
    </div>
    <select id="typeSelect">
      <option value="straight">Прямая</option>
      <option value="lshape">Г-образная</option>
      <option value="ushape">П-образная</option>
      <option value="spiral">Винтовая</option>
    </select>
    <div id="paramsContainer"></div>
    <div class="btns">
      <button id="buildBtn">🔄 Построить</button>
      <button id="resetBtn" title="Вернуть значения по умолчанию">Сброс</button>
    </div>
    <div id="resultsBox"></div>
    <div id="warnBox" hidden></div>
    <div class="legend">
      <span><span class="color-dot" style="background:#ff5555"></span> H общая</span>
      <span><span class="color-dot" style="background:#5599ff"></span> h подступенок</span>
      <span><span class="color-dot" style="background:#ffaa00"></span> b проступь</span>
      <span><span class="color-dot" style="background:#66cc66"></span> W ширина</span>
      <span><span class="color-dot" style="background:#dda0dd"></span> L длина</span>
    </div>
  </div>

  <div id="fab">
    <button id="btnPanel" class="active" title="Параметры">⚙</button>
    <button id="btnViews" title="Чертежи 2D">📐</button>
  </div>

  <div id="views2d">
    <div class="canvas2d"><canvas id="sideCanvas"></canvas></div>
    <div class="canvas2d"><canvas id="frontCanvas"></canvas></div>
    <div class="canvas2d"><canvas id="topCanvas"></canvas></div>
  </div>

  <div id="info"><span id="summary"></span><br><span id="hint"></span></div>
  <div id="glError" hidden>Не удалось запустить 3D (WebGL недоступен на этом устройстве).<br>Расчёты и чертежи 2D работают — нажмите 📐.</div>

  <script src="app.js"></script>
</body>
</html>
