plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mashynbazar.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mashynbazar.app'
        minSdk 26
        targetSdk 34
        // На GitHub номер сборки = номер выпуска build-N: по нему приложение узнаёт, что вышла новая версия
        versionCode System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 16
        versionName '1.6.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
