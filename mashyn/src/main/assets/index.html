<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Maşyn Bazar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Мобильное приложение: шапка сверху, лента карточек, нижняя навигация. Темы задаются на body[data-t]. */
:root{
  --font-d:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-b:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;--r-s:12px;
  --bg1:#0f0c29;--bg2:#302b63;--bg3:#1b1a3a;
  --card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.13);--line:rgba(255,255,255,.12);
  --text:#f3f1ff;--dim:#aeaad0;--accent:#a78bfa;--accent2:#f472b6;--on:#170f36;
  --glow:rgba(167,139,250,.35);--danger:#ff6b7a;--ok:#4ade80;--warn:#fbbf24;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
body[data-t="emerald"]{--bg1:#01140e;--bg2:#0b4a36;--bg3:#04271c;--accent:#e9c45b;--accent2:#34d399;--text:#eafff6;--dim:#9ccab9;--on:#1f1700;--glow:rgba(233,196,91,.3)}
body[data-t="gold"]{--bg1:#070707;--bg2:#2e230b;--bg3:#121008;--accent:#f6c343;--accent2:#ff9f1c;--text:#fff8e8;--dim:#c2b28e;--on:#1b1200;--glow:rgba(246,195,67,.3)}
body[data-t="ocean"]{--bg1:#03101c;--bg2:#0b4466;--bg3:#061f33;--accent:#3fe3f7;--accent2:#6ee7b7;--text:#e9fbff;--dim:#92bccc;--on:#00262f;--glow:rgba(63,227,247,.3)}
body[data-t="light"]{--bg1:#f7f8fd;--bg2:#e3e7fb;--bg3:#f3f4fb;--card:#ffffff;--card2:#eef0f8;--line:rgba(24,28,70,.10);--text:#161935;--dim:#5b6187;--accent:#4f46e5;--accent2:#db2777;--on:#ffffff;--glow:rgba(79,70,229,.25);--danger:#dc2626;--ok:#059669;--warn:#b45309;--shadow:0 8px 24px rgba(30,40,90,.12);color-scheme:light}

*{box-sizing:border-box}
html{height:100%;background:var(--bg1)}
body{min-height:100%;margin:0;font-family:var(--font-b);font-size:15px;line-height:1.45;color:var(--text);
  background:radial-gradient(120% 60% at 100% 0%,var(--glow),transparent 60%),linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg1)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-family:var(--font-d);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem}h3{font-size:1rem}
.dim{color:var(--dim)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.num{font-variant-numeric:tabular-nums}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:color-mix(in srgb,var(--bg1) 72%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.logo{font-family:var(--font-d);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--on);flex:none}
.top-title{font-family:var(--font-d);font-weight:700;font-size:1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent2)}
.spacer{flex:1}

main{padding-block:14px 110px;display:flex;flex-direction:column;gap:18px}
.screen-in{animation:in .28s ease both}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen-in,.sheet-panel,.toast{animation:none!important;transition:none!important}}

/* Нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);
  background:color-mix(in srgb,var(--bg1) 80%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;color:var(--dim);padding:4px 0;min-width:0}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent)}
.nav .plus span.p{width:52px;height:52px;margin-top:-26px;border-radius:18px;display:grid;place-items:center;color:var(--on);
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px var(--glow)}
.nav .plus svg{width:26px;height:26px}

/* Общие элементы */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);box-shadow:0 8px 22px var(--glow);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);box-shadow:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:11px}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.link{color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.82rem;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border-color:transparent;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:7px;text-transform:uppercase}
.b-vip{background:linear-gradient(135deg,#f6c343,#ff8a3d);color:#2a1600}
.b-top{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.b-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.b-dim{background:var(--card2);color:var(--dim)}
.red-note{color:var(--danger);font-size:.78rem;line-height:1.4;display:flex;gap:6px}
.red-note::before{content:"●";font-size:.6rem;line-height:1.9}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-title h2{font-size:1.02rem}
.empty{text-align:center;padding:36px 16px;color:var(--dim)}
.empty svg{width:56px;height:56px;opacity:.6;margin-bottom:8px}

/* Поиск и поля */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.search svg{width:20px;height:20px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:.95rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;color:var(--dim);font-weight:500}
.inp{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none;font-size:.95rem}
textarea.inp{min-height:110px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select.inp option{background:var(--bg1);color:var(--text)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.err{color:var(--danger);font-size:.78rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.seg button{min-height:38px;border-radius:10px;font-size:.85rem;font-weight:600;color:var(--dim)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* Разделы на главной */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:.7rem;text-align:center;line-height:1.2;min-width:0}
.cat .ci{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent2) 22%,transparent));color:var(--accent)}
.cat .ci svg{width:24px;height:24px}
.hero{position:relative;overflow:hidden;padding:18px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 34%,transparent),color-mix(in srgb,var(--accent2) 26%,transparent));border:1px solid var(--line)}
.hero h1{font-size:1.3rem;line-height:1.2;max-width:14ch;position:relative;z-index:1}
.hero p{margin:6px 0 12px;color:var(--text);opacity:.85;font-size:.88rem;max-width:22ch;position:relative;z-index:1}
.hero .btn{position:relative;z-index:1}
.hero .art{position:absolute;right:-44px;bottom:-26px;width:190px;opacity:.9;pointer-events:none}

/* Карточки объявлений */
.list{display:flex;flex-direction:column;gap:12px}
.lc{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);position:relative;text-align:left;width:100%}
.lc.hl{border:1.5px solid var(--accent);box-shadow:0 0 0 3px var(--glow)}
.lc .th{width:118px;height:92px;border-radius:13px;overflow:hidden;background:var(--card2);position:relative}
.lc .th img,.lc .th svg{width:100%;height:100%;object-fit:cover;display:block}
.lc .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.lc .t{font-weight:600;font-size:.92rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lc .p{font-family:var(--font-d);font-weight:700;font-size:1rem}
.lc .m{font-size:.76rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .bd{display:flex;gap:4px;flex-wrap:wrap}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--bg1) 55%,transparent);color:var(--text)}
.fav svg{width:18px;height:18px}
.fav.on{color:var(--accent2)}
.vip-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.vip-row::-webkit-scrollbar{display:none}
.vc{flex:0 0 220px;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;position:relative}
.vc .th{height:130px;position:relative}
.vc .th img,.vc .th svg{width:100%;height:100%;object-fit:cover;display:block}
.vc .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.vc .p{font-family:var(--font-d);font-weight:700}
.vc .badge{position:absolute;top:10px;left:10px}

/* Карточка объявления */
.gal{position:relative;border-radius:22px;overflow:hidden;background:var(--card2)}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-track::-webkit-scrollbar{display:none}
.gal-track>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;max-width:100%}
.gal-track img,.gal-track svg{width:100%;height:100%;object-fit:cover;display:block}.gal-track img{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:200;background:#000}
.zoom-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.zoom-track::-webkit-scrollbar{display:none}
.zoom-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;overflow:hidden}
.zoom-slide img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pan-x;user-select:none}
.zoom-x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.zoom-x svg{width:22px;height:22px}
.zoom-n{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:.9rem;opacity:.8}
.gal-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.gal-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.gal-dots i.on{background:#fff;width:18px;border-radius:4px}
.price-big{font-family:var(--font-d);font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spec{padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
.spec .k{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.spec .v{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.breakdown .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.breakdown .r:last-child{border:0;font-weight:700}
.steps{display:flex;gap:6px}
.steps div{flex:1;text-align:center;font-size:.7rem;color:var(--dim);display:flex;flex-direction:column;gap:6px;align-items:center}
.steps div::before{content:"";width:100%;height:5px;border-radius:3px;background:var(--card2)}
.steps div.on{color:var(--text);font-weight:600}
.steps div.on::before{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.seller{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none}
.contact-lock{display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;padding:16px;border-radius:var(--r);border:1px dashed var(--line);background:var(--card)}
.phone-num{font-family:var(--font-d);font-weight:700;font-size:1.15rem;letter-spacing:.02em;user-select:all}
.react{display:flex;gap:8px;flex-wrap:wrap}
.react button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.88rem}
.react button.on{border-color:var(--accent);color:var(--accent)}
.react svg{width:18px;height:18px}
.cm{display:flex;gap:10px}
.cm .ava{width:34px;height:34px;border-radius:11px;font-size:.8rem}
.cm .body{flex:1;min-width:0;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.cm .body p{margin:4px 0 0;font-size:.9rem;overflow-wrap:anywhere}
.cm .meta{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--dim);flex-wrap:wrap}

/* Подписки */
.plan{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-align:left;width:100%;position:relative}
.plan.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.plan .pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.plan .now{font-family:var(--font-d);font-size:1.35rem;font-weight:800}
.plan s{color:var(--dim);font-size:.9rem}
.disc{position:absolute;top:12px;right:12px;padding:4px 9px;border-radius:9px;font-weight:800;font-size:.8rem;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on)}
.save{color:var(--ok);font-size:.8rem;font-weight:600}
.copy-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--card2)}
.copy-row b,.copy-row .phone-num{white-space:nowrap}

/* Нижний лист и тост */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.sheet[hidden]{display:none!important}
.sheet-panel{width:100%;max-width:560px;max-height:86%;overflow-y:auto;border-radius:24px 24px 0 0;background:var(--bg3);border:1px solid var(--line);border-bottom:0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease both;display:flex;flex-direction:column;gap:14px}
body[data-t="light"] .sheet-panel{background:#fff}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg3);border-top:1px solid var(--line)}
body[data-t="light"] .sheet-foot{background:#fff}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;
  padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg1);font-weight:600;font-size:.88rem;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Профиль и админка */
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.menu button:last-child{border:0}
.menu svg{width:20px;height:20px;color:var(--accent);flex:none}
.menu .grow{flex:1;min-width:0}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.th-sw{aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden}
.th-sw.on{border-color:var(--text)}
.th-sw span{position:absolute;right:6px;bottom:6px;width:14px;height:14px;border-radius:50%}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--font-d);font-size:1.2rem}
.adm-item{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.adm-item .acts{display:flex;gap:8px;flex-wrap:wrap}
.demo-note{font-size:.74rem;color:var(--dim);padding:10px 12px;border-radius:12px;border:1px dashed var(--line)}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.photo-grid .ph{aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;position:relative;background:var(--card2)}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover}
.photo-grid .ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.9rem}
.photo-add{aspect-ratio:1;max-width:100%;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--dim);font-size:.7rem;text-align:center}
.photo-add svg{width:22px;height:22px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;min-width:0}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick svg{width:16px;height:16px;color:var(--dim);flex:none}
.pw{position:relative}.pw .inp{padding-right:52px}
.eye{position:absolute;right:4px;top:4px;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--dim)}
.eye svg{width:20px;height:20px}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.blist{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;padding:2px 12px;background:var(--card)}
.blist .check{min-height:38px;font-size:.88rem}
.bgh{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;padding:10px 0 2px}
.pk-list{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.pk-list button{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
.pk-list button.on{color:var(--accent);font-weight:700}
.pk-list .bgh{padding:10px 14px 4px}
.mode-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent);font-size:.86rem}
.mode-banner svg{width:20px;height:20px;color:var(--ok);flex:none;margin-top:1px}

/* ================== Иллюстрации техники (SVG) ================== */
function art(kind, color='#7c6cf0', seed=1, bare=false){
  const g = 'g'+seed+Math.random().toString(36).slice(2,6);
  const hue = color;
  const wheel = (x,y,r=20)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#15151c"/><circle cx="${x}" cy="${y}" r="${r*.55}" fill="#9aa0b4"/><circle cx="${x}" cy="${y}" r="${r*.2}" fill="#2a2a33"/>`;
  const shell = inner => `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Иллюстрация"><defs>
    <linearGradient id="${g}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hue}" stop-opacity=".55"/><stop offset="1" stop-color="#0d0b1f"/></linearGradient>
    <linearGradient id="${g}c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${hue}"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
    <linearGradient id="${g}w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe6ff"/><stop offset="1" stop-color="#3b4a6b"/></linearGradient></defs>
    ${bare?'':`<rect width="320" height="200" fill="url(#${g}b)"/><circle cx="260" cy="40" r="70" fill="#fff" opacity=".06"/>`}
    <ellipse cx="160" cy="166" rx="140" ry="12" fill="#000" opacity=".35"/>${inner}</svg>`;
  const C = `url(#${g}c)`, W = `url(#${g}w)`;
  switch(kind){
    case 'suv': return shell(`<path d="M28 146V118q2-14 22-16l30-3 22-32q5-7 15-7h112q14 0 22 10l22 28q24 4 26 22v26q0 6-6 6H34q-6 0-6-6z" fill="${C}"/>
      <path d="M110 72h46v30h-66zM164 72h56q8 0 13 7l17 23h-86z" fill="${W}" opacity=".9"/>${wheel(84,150,23)}${wheel(242,150,23)}`);
    case 'truck': case 'fridge': return shell(`<rect x="24" y="48" width="176" height="94" rx="8" fill="${kind==='fridge'?'#e9eef8':C}"/>
      ${kind==='fridge'?`<g stroke="${hue}" stroke-width="5" stroke-linecap="round"><path d="M112 70v50M90 82l44 26M90 108l44-26"/></g>`:''}
      <path d="M206 142V80q0-8 8-8h38q12 0 19 13l18 26q4 6 4 14v17z" fill="${C}"/><path d="M216 82h34l17 26h-51z" fill="${W}"/>
      ${wheel(66,150,18)}${wheel(114,150,18)}${wheel(252,150,18)}`);
    case 'crane': return shell(`<path d="M26 146v-24h196v24z" fill="#2b2d3a"/><path d="M222 146V96q0-8 8-8h32q10 0 16 10l14 22q3 5 3 12v14z" fill="${C}"/>
      <path d="M232 98h28l12 20h-40z" fill="${W}"/><rect x="70" y="100" width="44" height="22" rx="4" fill="${C}"/>
      <path d="M92 104 262 30" stroke="${hue}" stroke-width="12" stroke-linecap="round"/><path d="M92 104 262 30" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
      <path d="M262 30v52" stroke="#d9dce6" stroke-width="2"/><path d="M254 82h16l-8 10z" fill="#d9dce6"/>${wheel(56,152,15)}${wheel(98,152,15)}${wheel(180,152,15)}${wheel(256,152,15)}`);
    case 'gear': { let pts=''; for(let i=0;i<24;i++){ const a=i*Math.PI/12, r=i%2?46:60; pts+=`${160+r*Math.cos(a)},${100+r*Math.sin(a)} `; }
      return shell(`<polygon points="${pts}" fill="${C}"/><circle cx="160" cy="100" r="22" fill="#141320"/><circle cx="160" cy="100" r="9" fill="${hue}"/>`); }
    case 'wrench': return shell(`<g transform="rotate(-35 160 100)"><rect x="70" y="88" width="170" height="24" rx="12" fill="${C}"/>
      <circle cx="248" cy="100" r="30" fill="${C}"/><rect x="250" y="88" width="34" height="24" fill="url(#${g}b)"/><circle cx="78" cy="100" r="8" fill="#141320"/></g>`);
    case 'job': return shell(`<circle cx="160" cy="98" r="62" fill="none" stroke="${C}" stroke-width="16"/><circle cx="160" cy="98" r="16" fill="${hue}"/>
      <path d="M160 82V40M146 106l-42 26M174 106l42 26" stroke="${C}" stroke-width="12" stroke-linecap="round"/>`);
    default: return shell(`<path d="M26 142q2-24 34-30l40-6 30-26q8-7 20-7h62q16 0 28 9l34 26q36 3 40 20v14q0 6-6 6H32q-6 0-6-6z" fill="${C}"/>
      <path d="M126 82q6-5 14-5h28v30h-62zM176 77h22q11 0 19 6l24 24h-65z" fill="${W}" opacity=".9"/>

const ser = (coll, r) => JSON.stringify(r, (k, v) => k.startsWith('_') || (coll==='users' && k==='email') ? undefined : v);
const sharedSettings = () => { const {theme, lang, ...rest} = S.settings; return rest; };

function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({favs:S.favs, fails:S.fails, theme:S.settings.theme, lang:S.settings.lang})); }catch{} }

async function pull(){
  const rows = [];
  for (let from = 0; ; from += 1000){
    const {data, error} = await sb.from('mb_records').select('coll,id,data').range(from, from+999);
    if (error) throw error;
    rows.push(...data);
    if (data.length < 1000) break;
  }
  const next = Object.fromEntries(COLLS.map(c => [c, []]));
  let settings = null;
  for (const r of rows){ if (r.coll==='settings') settings = r.data; else if (next[r.coll]) next[r.coll].push(r.data); }
  next.notifs.sort((a,b) => b.time-a.time);
  next.comments.sort((a,b) => a.time-b.time);
  const {data:{session}} = await sb.auth.getSession();
  Object.assign(S, next);
  S.settings = {...DEFAULT_SETTINGS, ...(settings||{}), theme:S.settings.theme, lang:S.settings.lang};
  S.session = session?.user.id || null;
  const u = me(); if (u) u.email = session.user.user_metadata?.email || '';
  synced = {settings: ser('settings', sharedSettings())};
  for (const c of COLLS) synced[c] = new Map(S[c].map(r => [r.id, ser(c, r)]));
}

async function push(){
  let failed = 0;
  const save = async (coll, id, json, exists) => {
    const data = JSON.parse(json);
    const {error} = exists
      ? await sb.from('mb_records').update({data}).match({coll, id})
      : await sb.from('mb_records').insert({coll, id, data});
    if (error){ failed++; console.warn(coll, id, error.message); return; }
    synced[coll].set(id, json);
  };
  for (const c of COLLS){
    const old = synced[c], seen = new Set();
    for (const r of S[c]){ seen.add(r.id); const j = ser(c, r); if (old.get(r.id) !== j) await save(c, r.id, j, old.has(r.id)); }
    for (const id of [...old.keys()]) if (!seen.has(id)){
      const {error} = await sb.from('mb_records').delete().match({coll:c, id});
      if (error){ failed++; console.warn(c, id, error.message); } else old.delete(id);
    }
  }
  const sj = ser('settings', sharedSettings());
  if (sj !== synced.settings){
    const {error} = await sb.from('mb_records').upsert({coll:'settings', id:'main', data:JSON.parse(sj)});
    if (error){ failed++; console.warn('settings', error.message); } else synced.settings = sj;
  }
  if (failed){ toast('Часть изменений не сохранилась. Проверьте интернет.'); await pull(); render(); }
}

function persist(){
  saveLocal();
  syncing = syncing.then(push).catch(e => { console.warn(e); toast('Нет связи с сервером. Проверьте интернет.'); });
  return true;
}
// Сначала дописываем свои изменения, потом берём свежие данные
async function refresh(){ await syncing; await pull(); }

// Вход в Supabase есть, а профиля в приложении нет (регистрация оборвалась) — создаём его из данных регистрации
async function ensureProfile(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session || me()) return;
  const m = session.user.user_metadata || {};
  if (!m.phone) return;
  S.users.push({id:session.user.id,name:m.name||'Пользователь',phone:m.phone,email:m.email||'',type:'person',company:'',role:'user',created:now(),freeUsed:false,blocked:false});
  S.session = session.user.id; persist(); await refresh();
}

/* Уведомления, когда приложение закрыто (только в Android-приложении, MBAndroid — мост из MainActivity) */
const NB = window.MBAndroid || null;
async function deviceOn(){
  if (!NB || !S.session) return;
  try { await sb.rpc('mb_register_device', {p_key:NB.deviceKey()}); NB.enable(Date.now()); } catch (e){ console.warn(e); }
}
async function deviceOff(){
  if (!NB) return;
  try { NB.disable(); await sb.rpc('mb_unregister_device', {p_key:NB.deviceKey()}); } catch (e){ console.warn(e); }
}
window.mbOpenNotifs = () => notifSheet();

async function uploadPhoto(dataUrl){
  if (!dataUrl.startsWith('data:')) return dataUrl;
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${S.session}/${Date.now()}-${uid()}.jpg`;
  const {error} = await sb.storage.from('media').upload(path, blob, {contentType:'image/jpeg'});
  if (error) throw error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
/* Состояние объявлений по времени */
function tick(){
  let changed = false;
  // Каждый телефон следит только за сроками своих объявлений и подписок
  for (const l of S.listings){
    if (l.uid !== S.session) continue;
    if (l.status==='active' && l.until < now()){ l.status='expired'; changed=true; notify(l.uid, `Срок объявления «${l.title}» закончился. Оно скрыто, продлите подпиской.`); }
    if (l.status==='active' && !l.remind && l.until - now() < 2*DAY){ l.remind=1; changed=true; notify(l.uid, `Объявлению «${l.title}» осталось ${daysLeft(l.until)} дн. Продлите подпиской.`); }
  }
  for (const s of S.subs) if (s.uid===S.session && s.status==='active' && s.until < now()){ s.status='ended'; changed=true; }
  if (changed) persist();
}
function notify(u, text){ if (!u) return; S.notifs.unshift({id:uid(),uid:u,text,time:now(),read:false}); }
const me = () => S.users.find(u => u.id === S.session) || null;
const userById = id => S.users.find(u => u.id === id);
const visible = l => l.status==='active' && l.until > now() && !l.hiddenByComplaints;
const isOn = (l, k) => l[k] && l[k] > now();
function rank(arr, sort){
  const a = [...arr];
  if (sort==='cheap') a.sort((x,y)=>(x.price||Infinity)-(y.price||Infinity));
  else if (sort==='exp') a.sort((x,y)=>(y.price||0)-(x.price||0));
  else a.sort((x,y)=> (isOn(y,'top')-isOn(x,'top')) || (y.created-x.created));
  return a;
}
const priceText = l => {
  if (l.sec==='jobs' && l.specs?.kind==='seek' && !l.price) return 'Зарплата по договорённости';
  if (l.unit==='договорная' || !l.price) return 'Договорная';
  return (l.unit==='от' ? 'от ' : '') + fmt(l.price) + ' TMT' + (l.unit && l.unit!=='от' ? ' ' + l.unit : '');
};
const metaText = l => {
  const s = l.specs||{};
  if (['cars','import','rent'].includes(l.sec)) return [s.year, s.km?fmt(s.km)+' км':null, s.country, placeText(l)].filter(Boolean).join(' · ');
  if (l.sec==='tech') return [s.ttype, s.tbrand, s.cap, placeText(l)].filter(Boolean).join(' · ');
  if (l.sec==='jobs') return [s.kind==='hire'?'Вакансия':'Резюме', s.lic?'кат. '+s.lic:null, placeText(l)].filter(Boolean).join(' · ');
  if (l.sec==='parts') return [s.pcat, s.pbrand, s.pcond, placeText(l)].filter(Boolean).join(' · ');
  return [s.stype, placeText(l)].filter(Boolean).join(' · ');
};

let stack = [{name:'home'}];
const state = {filters:{}, sort:'new', q:'', jobKind:'all', draft:null, plan:{sec:'cars',m:1,tier:0,acct:null}};
function go(name, arg, replace){ if (replace) stack[stack.length-1]={name,arg}; else stack.push({name,arg}); render(); window.scrollTo(0,0); }
function root(name){ stack=[{name}]; render(); window.scrollTo(0,0); }
function back(){ if ($('#zoom')){ closeZoom(); return true; } if ($('#sheet').hidden===false){ closeSheet(); return true; } if (stack.length>1){ stack.pop(); render(); return true; } return false; }
window.mbBack = back;   // для кнопки «Назад» в Android

function render(){
  tick();
  const cur = stack[stack.length-1];
  const fn = SCREENS[cur.name] || SCREENS.home;
  const out = fn(cur.arg);
  $('#view').innerHTML = `<div class="screen-in col" style="gap:18px">${out.html}</div>`;
  renderBar(out.title);
  renderNav(cur.name);
  out.after && out.after();
}

        : !u.freeUsed?`<div class="card pad row" style="border-color:var(--ok)">${ic('star','style="width:22px;height:22px;color:var(--ok)"')}<div><b>Первое объявление — бесплатно на 7 дней</b><div class="small dim">До 5 фото. Потом — продление подпиской.</div></div></div>`:''}
      <div class="list">${SECTIONS.map(s=>`<button class="card pad row" data-a="draft" data-v="${s.k}" style="text-align:left"><span class="ci" style="width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card2);color:var(--accent)">${ic(s.icon)}</span><b style="flex:1">${t('s_'+s.k)}</b>
        ${s.k==='jobs'?'<span class="badge b-ok">резюме бесплатно</span>':''}</button>`).join('')}</div>`};
    const sec = d.sec, maxPh = maxPhotos(u, sec, d.specs?.kind);
    const field = f => {
      const v = d.specs[f.k] ?? '';
      if (f.type==='select') return `<div class="field"><label for="f_${f.k}">${f.l}${f.req?' *':''}</label><select class="inp" id="f_${f.k}" data-f="${f.k}"><option value="">Не выбрано</option>${f.o.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      if (f.type==='seg') return `<div class="field"><label>${f.l}</label><div class="seg">${f.o.map(([k,n])=>`<button class="${v===k?'on':''}" data-a="dseg" data-v="${f.k}:${k}">${n}</button>`).join('')}</div></div>`;
      if (f.type==='multi') return `<div class="field"><label>${f.l}</label><div class="chips">${f.o.map(o=>`<button class="chip ${(v||'').split(', ').includes(o)?'on':''}" data-a="dmulti" data-v="${f.k}:${o}">${o}</button>`).join('')}</div></div>`;
      if (f.type==='brand' || f.type==='model') return `<div class="field"><label>${f.l}${f.req?' *':''}</label><button type="button" class="inp pick" data-a="pick" data-v="${f.k}">${v?`<span>${esc(v)}</span>`:`<span class="dim">Выберите</span>`}${ic('chev')}</button></div>`;
      if (f.type==='check') return `<label class="check"><input type="checkbox" id="f_${f.k}" data-f="${f.k}" ${v?'checked':''}>${f.l}</label>`;
      return `<div class="field"><label for="f_${f.k}">${f.l}${f.req?' *':''}</label><input class="inp" id="f_${f.k}" data-f="${f.k}" ${f.type==='number'?'type="number" inputmode="decimal"':''} placeholder="${esc(f.ph||'')}" value="${esc(v)}"></div>`;
    };
    const units = UNITS[sec]||[''];
    const isSeek = sec==='jobs' && d.specs.kind==='seek';
    return {title:t('s_'+sec), html:`
      <div class="between"><h2>${t('s_'+sec)}</h2><button class="link small" data-a="draft" data-v="">Сменить раздел</button></div>
      <div class="field"><label for="d_title">Заголовок *</label><input class="inp" id="d_title" maxlength="80" placeholder="${sec==='jobs'?'Ищу водителя на фуру, категория CE':'Toyota Camry 3.5 XLE'}" value="${esc(d.title||'')}"></div>
      <div class="grid2">${FIELDS[sec].filter(f=>!['seg','multi','check'].includes(f.type)).map(field).join('')}</div>
      ${FIELDS[sec].filter(f=>['seg','multi','check'].includes(f.type)).map(field).join('')}
      ${sec!=='import'?`<div class="grid2"><div class="field"><label for="d_price">${sec==='jobs'?'Зарплата, TMT':'Цена, TMT'}${['cars','parts','rent'].includes(sec)?' *':''}</label><input class="inp num" id="d_price" type="number" inputmode="numeric" placeholder="${sec==='jobs'?'6500':'395000'}" value="${esc(d.price||'')}"></div>
        ${units.length>1||units[0]?`<div class="field"><label for="d_unit">Единица</label><select class="inp" id="d_unit">${units.map(x=>`<option ${d.unit===x?'selected':''}>${x}</option>`).join('')}</select></div>`:''}</div>`
        :`<div class="small dim">Итоговая цена «под ключ» посчитается сама: авто + доставка + растаможка.</div>`}
      <div class="col"><div class="field"><label for="d_reg">Регион *</label><select class="inp" id="d_reg">${REGIONS.map(r=>`<option value="${esc(r.k)}" ${d.reg===r.k?'selected':''}>${esc(r.k)}</option>`).join('')}</select></div>
        <div class="field"><label for="d_place">Город или этрап</label><select class="inp" id="d_place">${placeOptions(d.reg, d.place)}</select></div></div>
      <div class="field"><label for="d_desc">${t('descr')}</label><textarea class="inp" id="d_desc" maxlength="2000" placeholder="Состояние, комплектация, условия">${esc(d.desc||'')}</textarea></div>
      <div class="field"><label>Фото (${d.photos.length} из ${maxPh})</label><div class="photo-grid">
        ${d.photos.map((p,i)=>`<div class="ph"><img src="${p}" alt=""><button data-a="delph" data-v="${i}" aria-label="Удалить фото">×</button></div>`).join('')}
        ${d.photos.length<maxPh?`<label class="photo-add">${ic('photo')}<span>Добавить</span><input type="file" id="d_ph" accept="image/*" multiple hidden></label>`:''}</div>
        <span class="tiny dim">До 5 фото. Каждое приложение само уменьшит до 1 МБ, чтобы быстро грузилось при медленном интернете.</span></div>      <div class="err" id="d_err"></div>
      <div class="card pad small">${postTerms(u, sec, isSeek)}</div>
      <button class="btn wide" data-a="publish">${ic('check')}${t('publish')}</button>`,
      after(){
        document.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('change',()=>{ d.specs[el.dataset.f] = el.type==='checkbox' ? (el.checked?'Да':'') : el.value; }));
        $('#d_reg').addEventListener('change', e=>{ d.reg=e.target.value; d.place=''; $('#d_place').innerHTML = placeOptions(d.reg,''); });
        $('#d_place').addEventListener('change', e=>{ d.place=e.target.value; });
        ['title','price','unit','desc'].forEach(k=>{ const el=$('#d_'+k); el && el.addEventListener('input',()=>{ d[k]=el.value; }); });
        const ph=$('#d_ph'); ph && ph.addEventListener('change', async ()=>{
          for (const file of [...ph.files].slice(0, maxPh - d.photos.length)){ try{ d.photos.push(await compress(file)); }catch{ toast('Не удалось прочитать фото'); } }
          render();
        });
      }};
  },

  plans(sec){
    const p = state.plan; if (sec) p.sec = planKey(sec);
    if (!p.acct) p.acct = me()?.type==='company' ? 'company' : 'person';
    const P = planOf(p.sec, p.acct), pi = PERIODS.findIndex(x=>x.m===p.m);
    if (p.tier >= P.tiers.length) p.tier = 0;
    const mode = S.settings.mode;
    const banner = mode==='free'
      ? `<div class="mode-banner">${ic('star')}<div><b>Сейчас период запуска — все объявления бесплатно.</b><br><span class="dim">Платить ничего не нужно. Цены ниже начнут действовать позже, мы заранее предупредим.</span></div></div>`
      : mode==='per' ? `<div class="mode-banner">${ic('card')}<div><b>Сейчас оплата за каждое объявление:</b> ${S.settings.perPerson} TMT частным лицам и ${S.settings.perCompany} TMT компаниям, на 30 дней.<br><span class="dim">Подписка выгоднее, если объявлений несколько.</span></div></div>` : '';
    return {title:t('subs'), html:`
      <h2>Подписки на объявления</h2>${banner}
      <div class="seg"><button class="${p.acct==='person'?'on':''}" data-a="pacct" data-v="person">Частным лицам</button><button class="${p.acct==='company'?'on':''}" data-a="pacct" data-v="company">Компаниям</button></div>
      <div class="chips">${PLAN_SECS.map(([k,n])=>`<button class="chip ${p.sec===k?'on':''}" data-a="psec" data-v="${k}">${n}</button>`).join('')}</div>
      <div class="seg">${PERIODS.map(x=>`<button class="${p.m===x.m?'on':''}" data-a="pper" data-v="${x.m}">${x.m} ${t('month')}${x.d?`<br><span class="tiny">−${x.d}%</span>`:''}</button>`).join('')}</div>
      <div class="list">${P.tiers.map((tr,ti)=>{
        const price = P.p[pi][ti], full = P.p[0][ti]*p.m, saveSum = full-price;
        return `<button class="plan ${p.tier===ti?'on':''}" data-a="ptier" data-v="${ti}">
          ${PERIODS[pi].d?`<span class="disc">−${PERIODS[pi].d}%</span>`:''}
          <b>${p.m} ${t('month')} · ${tr.n}</b>
          <div class="pr"><span class="now num">${fmt(price)} TMT</span>${saveSum>0?`<s class="num">${fmt(full)} TMT</s>`:''}</div>
          ${saveSum>0?`<span class="save num">Экономия ${fmt(saveSum)} TMT · всего ${fmt(Math.round(price/p.m))} TMT ${t('perMonth')}</span>`:`<span class="tiny dim">Без скидки. Чем дольше срок, тем выгоднее.</span>`}
          <span class="tiny dim num">≈ ${fmt(Math.round(price*S.settings.rub))} ₽ при оплате через банк РФ</span></button>`; }).join('')}</div>
      <div class="col small dim" style="gap:4px"><span>✓ Первое объявление — бесплатно на 7 дней</span><span>✓ «Ищу работу» — всегда бесплатно</span><span>✓ Скрытые объявления включатся сразу после оплаты</span>${p.acct==='company'?'<span>✓ Тарифы компаний: автосалоны, импортёры, магазины, автопарки</span>':''}</div>
      ${mode==='free' ? `<button class="btn ghost wide" data-a="tab" data-v="post">${ic('plus')}Подать объявление бесплатно</button>`
        : `<button class="btn wide" data-a="buy">${ic('card')}Оформить за ${fmt(P.p[pi][p.tier])} TMT</button>`}`};
  },

  pay(code){
    const o = S.payments.find(x=>x.code===code) || state.order;
    if (!o) return {title:t('pay'), html:emptyBox('Заказ не найден','')};
    const u = me(); const rub = Math.round(o.amount*S.settings.rub);
    const done = o.status==='pending' || o.status==='done';
    const what = orderWhat(o);
    if (done) return {title:t('pay'), html:`<div class="card pad col" style="align-items:center;text-align:center;gap:12px">
        <div class="ava" style="width:64px;height:64px;border-radius:22px">${ic(o.status==='done'?'check':'clock','style="width:30px;height:30px"')}</div>
        <h2>${o.status==='done'?'Оплата подтверждена':'Ожидает проверки'}</h2>
        <p class="small dim" style="margin:0">${o.status==='done'?'Подписка активна. Объявления в этом разделе снова видны всем.':'Администратор проверит перевод и включит подписку. Обычно это занимает до 30 минут. Вы получите уведомление.'}</p>
        <div class="copy-row" style="width:100%"><span class="small dim">Код заказа</span><b class="num">${o.code}</b></div>
        <div class="small">${esc(what)} — <b class="num">${fmt(o.amount)} TMT</b></div>
        <button class="btn ghost wide" data-a="tab" data-v="profile">В профиль</button></div>`};
    const m = state.payMethod || 'tm';
    const recip = m==='tm' ? S.settings.tmNumber : S.settings.rubNumber;
    return {title:t('pay'), html:`
      <div class="card pad col" style="gap:6px"><span class="small dim">${esc(what)}</span>
        <div class="price-big num">${fmt(o.amount)} TMT</div><span class="small dim num">или ${fmt(rub)} ₽ через банк РФ (курс ${S.settings.rub} ₽ за 1 TMT)</span></div>
      <div class="field"><label>Способ оплаты</label><div class="seg">
        <button class="${m==='tm'?'on':''}" data-a="paym" data-v="tm">С туркменского номера</button>
        <button class="${m==='rf'?'on':''}" data-a="paym" data-v="rf">Банк РФ</button></div></div>
      ${m==='rf'?`<div class="chips">${['Сбербанк','Альфа-Банк','Озон Банк','Другой банк'].map(b=>`<button class="chip ${state.bank===b?'on':''}" data-a="bank" data-v="${b}">${b}</button>`).join('')}</div>`:''}
      <div class="card pad col">
        <span class="small dim">${m==='tm'?'Переведите сумму на номер':'Переведите по номеру телефона (СБП)'}</span>
        <div class="copy-row"><span class="phone-num num">${esc(recip)}</span><button class="btn sm ghost" data-a="copy" data-v="${esc(recip)}">${ic('copy')}</button></div>
        <div class="copy-row"><span class="small">Сумма</span><b class="num">${m==='tm'?fmt(o.amount)+' TMT':fmt(rub)+' ₽'}</b></div>
        ${m==='rf'?`<div class="copy-row"><span class="small">Комментарий к переводу</span><span class="row"><b class="num">${o.code}</b><button class="btn sm ghost" data-a="copy" data-v="${o.code}">${ic('copy')}</button></span></div>`:''}
        <div class="col" style="gap:6px">
          ${m==='tm'
            ? `<div class="red-note">Переводите только с вашего номера ${esc(fmtPhone(u.phone))}. Перевод с другого номера не засчитается.</div>
               <div class="red-note">Сумма должна совпадать: ${fmt(o.amount)} TMT.</div>`
            : `<div class="red-note">Обязательно укажите код ${o.code} в комментарии к переводу. Без кода оплату невозможно найти.</div>
               <div class="red-note">Перевод должен быть привязан к аккаунту с номером ${esc(fmtPhone(u.phone))}.</div>`}
          <div class="red-note">Подписка включится после проверки перевода администратором.</div>
        </div>
      </div>
      <button class="btn wide" data-a="paid">${ic('check')}${t('iPaid')}</button>
      <div class="demo-note">Прототип: деньги никуда не уходят. Номера получателя задаются в админ-панели.</div>`};
  },

  auth(mode='login'){
    if (me()) return SCREENS.profile();
    const reg = mode==='register';
    const by = state.authBy || 'phone';
    return {title: reg?t('register'):t('login'), html:`
      <div class="col" style="align-items:center;text-align:center;gap:8px;padding-top:6px"><div class="logo-mark" style="width:58px;height:58px;border-radius:20px">${ic('car','style="width:30px;height:30px"')}</div>
        <h1 style="font-size:1.3rem">${reg?'Создать аккаунт':'Вход в Maşyn Bazar'}</h1><p class="small dim" style="margin:0">${reg?'Регистрация бесплатная. Платить нужно только за объявления.':'Войдите по номеру телефона или почте'}</p></div>
      <div class="seg"><button class="${!reg?'on':''}" data-a="auth" data-v="login">${t('login')}</button><button class="${reg?'on':''}" data-a="auth" data-v="register">${t('register')}</button></div>
      <form id="authf" class="col" novalidate>
        ${reg?`<div class="field"><label for="a_name">${t('name')}</label><input class="inp" id="a_name" autocomplete="name" placeholder="Мердан"></div>
          <div class="field"><label>Тип аккаунта</label><div class="seg"><button type="button" class="${(state.acType||'person')==='person'?'on':''}" data-a="actype" data-v="person">Частное лицо</button><button type="button" class="${state.acType==='company'?'on':''}" data-a="actype" data-v="company">Компания</button></div></div>
          ${state.acType==='company'?`<div class="field"><label for="a_comp">Название компании</label><input class="inp" id="a_comp" placeholder="Aşgabat Motors"></div>`:''}`:''}
        ${!reg?`<div class="seg"><button type="button" class="${by==='phone'?'on':''}" data-a="authby" data-v="phone">По телефону</button><button type="button" class="${by==='email'?'on':''}" data-a="authby" data-v="email">По почте</button></div>`:''}
        ${reg||by==='phone'?`<div class="field"><label for="a_phone">${t('phone')}</label><div class="row"><span class="chip" style="min-height:48px;border-radius:14px">+993</span><input class="inp num" id="a_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="65 123456" maxlength="11"></div></div>`:''}
        ${reg||by==='email'?`<div class="field"><label for="a_email">${t('email')}${reg?' (по желанию, для восстановления пароля)':''}</label><input class="inp" id="a_email" type="email" autocomplete="email" placeholder="merdan@mail.tm"></div>`:''}
        <div class="field"><label for="a_pw">${t('password')}</label><div class="pw"><input class="inp" id="a_pw" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="Не короче 6 символов"><button type="button" class="eye" data-a="eye" data-v="a_pw" aria-label="Показать пароль">${ic('eye')}</button></div></div>
        ${reg?`<div class="field"><label for="a_pw2">Повторите пароль</label><div class="pw"><input class="inp" id="a_pw2" type="password" autocomplete="new-password"><button type="button" class="eye" data-a="eye" data-v="a_pw2" aria-label="Показать пароль">${ic('eye')}</button></div></div>`:''}
        <div class="err" id="a_err"></div>
        <button class="btn wide" type="submit">${reg?t('register'):t('login')}</button>
        ${!reg?`<button type="button" class="link small" data-a="forgot">Забыли пароль?</button>`:''}
      </form>
      <div class="demo-note">Аккаунт работает на любом телефоне: объявления, комментарии и подписки хранятся на сервере.</div>`,
      after(){ $('#authf').addEventListener('submit', e=>{ e.preventDefault(); reg?doRegister():doLogin(); }); }};
  },

  profile(){
    const u = me();
    if (!u) return {title:t('profile'), html:guest()};
    const mine = S.listings.filter(l=>l.uid===u.id).sort((a,b)=>b.created-a.created);
    const subs = S.subs.filter(s=>s.uid===u.id && s.status==='active');
    const pend = S.payments.filter(p=>p.uid===u.id && p.status==='pending');
    return {title:t('profile'), html:`
      <div class="card pad seller"><div class="ava" style="width:56px;height:56px;border-radius:18px;font-size:1.1rem">${initials(u.name)}</div>
        <div style="flex:1;min-width:0"><h2 style="font-size:1.05rem">${esc(u.name)}</h2><div class="small dim num">${esc(fmtPhone(u.phone))}${u.email?' · '+esc(u.email):''}</div>
        <div class="row" style="gap:6px;margin-top:4px"><span class="badge b-dim">${u.type==='company'?'Компания':'Частное лицо'}</span>${u.role!=='user'?`<span class="badge b-vip">${u.role==='admin'?'Администратор':'Модератор'}</span>`:''}</div></div></div>
      <div class="stat-row"><div class="stat"><b class="num">${mine.filter(visible).length}</b><span class="tiny dim">активных</span></div>
        <div class="stat"><b class="num">${subs.length}</b><span class="tiny dim">подписок</span></div>
        <div class="stat"><b class="num">${(S.favs[u.id]||[]).length}</b><span class="tiny dim">в избранном</span></div></div>
      ${S.settings.mode==='free'?`<div class="mode-banner">${ic('star')}<div><b>Период запуска: все объявления бесплатно</b></div></div>`:''}
      ${S.settings.mode!=='free'&&!u.freeUsed?`<div class="card pad row" style="border-color:var(--ok)">${ic('star','style="width:22px;height:22px;color:var(--ok)"')}<div class="small"><b>У вас есть бесплатное объявление на 7 дней</b><br><span class="dim">Подайте первое объявление без оплаты</span></div></div>`:''}
      ${pend.length?`<div class="card pad small" style="border-color:var(--warn)"><b style="color:var(--warn)">Оплата на проверке: ${pend.map(p=>p.code).join(', ')}</b><br><span class="dim">Подписка включится после подтверждения администратором</span></div>`:''}

      <div class="col"><div class="sec-title"><h2>${t('myListings')}</h2><button class="link small" data-a="tab" data-v="post">+ Подать</button></div>
        ${mine.length?mine.map(l=>`<div class="card pad col" style="gap:8px"><button class="row" style="text-align:left" data-a="open" data-v="${l.id}">
          <div style="width:64px;height:48px;border-radius:10px;overflow:hidden;flex:none">${mainPic(l)}</div><div style="flex:1;min-width:0"><b class="small" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.title)}</b><span class="tiny dim num">${esc(priceText(l))}</span></div></button>
          <div class="between"><span class="badge ${visible(l)?(daysLeft(l.until)<=2?'b-warn':'b-ok'):'b-bad'}">${statusText(l)}</span>
          <span class="row" style="gap:6px">${!visible(l)&&['expired','nosub'].includes(l.status)?`<button class="btn sm" data-a="renew" data-v="${l.id}">${S.settings.mode==='free'?'Продлить бесплатно':'Продлить'}</button>`:''}<button class="btn sm ghost" data-a="dellist" data-v="${l.id}" aria-label="Удалить">${ic('trash')}</button></span></div></div>`).join('')
        : `<p class="small dim" style="margin:0">Пока нет объявлений.</p>`}</div>

      <div class="card menu">
        <button data-a="tab" data-v="plans">${ic('card')}<span class="grow">${t('subs')}<br><span class="tiny dim">${subs.length?subs.map(s=>`${tierName(s)} до ${dateStr(s.until)}`).join('; '):'Нет активных подписок'}</span></span></button>
        <button data-a="notifs">${ic('bell')}<span class="grow">${t('notifs')}</span></button>
        ${u.role!=='user'?`<button data-a="tab" data-v="admin">${ic('shield')}<span class="grow">${t('admin')}</span></button>`:''}

/* ================== Фото ================== */
const PHOTO_MAX_BYTES = 1024*1024;
function compress(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const k = Math.min(1, 1600/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      // Каждое фото — не больше 1 МБ: при необходимости снижаем качество
      let q = .8, url = c.toDataURL('image/jpeg', q);
      while (url.length*0.75 > PHOTO_MAX_BYTES && q > .3){ q -= .1; url = c.toDataURL('image/jpeg', q); }
      res(url);
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* Просмотр фото на весь экран: листать, приближать двумя пальцами или двойным касанием */
function openZoom(photos, start){
  closeZoom();
  const z = document.createElement('div');
  z.id = 'zoom'; z.className = 'zoom';
  z.innerHTML = `<div class="zoom-track">${photos.map(p=>`<div class="zoom-slide"><img src="${esc(p)}" alt="" draggable="false"></div>`).join('')}</div>
    <button class="zoom-x" aria-label="Закрыть">${ic('x')}</button>${photos.length>1?`<div class="zoom-n num"></div>`:''}`;
  document.body.appendChild(z);
  const track = z.querySelector('.zoom-track'), n = z.querySelector('.zoom-n');
  const showN = () => { if (n) n.textContent = `${Math.round(track.scrollLeft/track.clientWidth)+1} / ${photos.length}`; };
  track.scrollLeft = start*track.clientWidth; showN();
  track.addEventListener('scroll', showN, {passive:true});
  z.querySelector('.zoom-x').addEventListener('click', closeZoom);
  z.querySelectorAll('.zoom-slide img').forEach(img => pinch(img, track));
}
function closeZoom(){ $('#zoom')?.remove(); }

function pinch(img, track){
  let k = 1, x = 0, y = 0, start = null, lastTap = 0;
  // Пока фото приближено, свайп двигает его, а не листает к следующему
  const apply = () => { img.style.transform = `translate(${x}px,${y}px) scale(${k})`; track.style.overflowX = k>1 ? 'hidden' : 'auto'; img.style.touchAction = k>1 ? 'none' : 'pan-x'; };
  const clamp = () => { if (k<=1){ k=1; x=0; y=0; return; } k=Math.min(k,5); const mx=img.clientWidth*(k-1)/2, my=img.clientHeight*(k-1)/2; x=Math.max(-mx,Math.min(mx,x)); y=Math.max(-my,Math.min(my,y)); };
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  img.addEventListener('touchstart', e => {
    const t = e.touches;
    if (t.length===2) start = {d:dist(t), k};
    else if (t.length===1){
      if (Date.now()-lastTap < 300){ k = k>1 ? 1 : 2.5; x=0; y=0; clamp(); apply(); lastTap=0; start=null; return; }
      lastTap = Date.now(); start = {px:t[0].clientX-x, py:t[0].clientY-y};
    }
  }, {passive:true});
  img.addEventListener('touchmove', e => {
    const t = e.touches; if (!start) return;
    if (t.length===2 && start.d){ e.preventDefault(); k = start.k*dist(t)/start.d; clamp(); apply(); }
    else if (t.length===1 && k>1 && start.px!=null){ e.preventDefault(); x = t[0].clientX-start.px; y = t[0].clientY-start.py; clamp(); apply(); }
  }, {passive:false});
  img.addEventListener('touchend', e => { if (!e.touches.length) start = null; });
  // На компьютере: двойной щелчок приближает
  img.addEventListener('dblclick', () => { k = k>1 ? 1 : 2.5; x=0; y=0; apply(); });
}

/* ================== Бот-модератор ================== */
const BAD = ['дурак','идиот','тупой','лох','мразь','сволоч','урод'];
function botCheck(text, user, l){
  const flags = [];
  const low = text.toLowerCase();
  if (BAD.some(w=>low.includes(w))) flags.push('Оскорбления в тексте');
  if (/(https?:\/\/|www\.|t\.me|\.com\b|\.ru\b|\.tm\b)/i.test(text)) flags.push('Ссылка в описании');
  if (/(\+?\d[\d\s\-]{7,}\d)/.test(l?.desc||'')) flags.push('Телефон в тексте');
  if (l && l.price && ['cars','import'].includes(l.sec) && l.specs?.brand){
    const same = S.listings.filter(x=>x.sec===l.sec && x.specs?.brand===l.specs.brand && x.price && visible(x)).map(x=>x.price).sort((a,b)=>a-b);
    if (same.length){ const med = same[Math.floor(same.length/2)]; if (l.price < med*0.4) flags.push('Цена сильно ниже рынка'); }
  }
  if (l && S.listings.some(x=>x.uid===user.id && x.title===l.title && x.price===l.price && x.id!==l.id)) flags.push('Повтор объявления');
  if (l && S.listings.filter(x=>x.uid===user.id && now()-x.created<DAY).length>=5) flags.push('Слишком много объявлений за день');
  return flags;
}

async function doRegister(){
  const err = $('#a_err'); err.textContent='';
  const name=$('#a_name').value.trim(), ph=$('#a_phone').value.replace(/\D/g,''), em=$('#a_email').value.trim(), pw=$('#a_pw').value, pw2=$('#a_pw2').value;
  const phone = '+993'+ph;
  if (name.length<2) return err.textContent='Введите имя';
  if (!/^6\d{7}$/.test(ph)) return err.textContent='Номер — 8 цифр и начинается с 6, например 65 123456';
  if (em && !/^\S+@\S+\.\S+$/.test(em)) return err.textContent='Проверьте адрес почты';
  if (pw.length<6) return err.textContent='Пароль должен быть не короче 6 символов';
  if (pw!==pw2) return err.textContent='Пароли не совпадают';
  const taken = 'Этот номер уже зарегистрирован. Войдите или восстановите пароль.';
  if (S.users.some(u=>u.phone===phone)) return err.textContent=taken;
  if (em && (await sb.rpc('mb_email_taken', {p_email:em})).data) return err.textContent='Эта почта уже используется';
  err.textContent='Создаём аккаунт…';
  const {data, error} = await sb.auth.signUp({email:loginOf(phone), password:pw, options:{data:{name, phone, email:em}}});
  if (error) return err.textContent = /registered/i.test(error.message) ? taken : 'Не удалось создать аккаунт: '+error.message;
  if (!data.session) return err.textContent='Аккаунт создан. Войдите по номеру и паролю.';
  err.textContent='';
  const u = {id:data.user.id,name,phone,email:em||'',type:state.acType||'person',company:state.acType==='company'?($('#a_comp')?.value.trim()||name):'',role:'user',created:now(),freeUsed:false,blocked:false};
  if (u.type==='company' && u.company) u.name = u.company;
  S.users.push(u); S.session = u.id; notify(u.id,'Добро пожаловать! Первое объявление — бесплатно на 7 дней.'); persist();
  await refresh(); deviceOn();
  toast('Аккаунт создан'); afterAuth();
}
async function doLogin(){
  const err = $('#a_err'); err.textContent='';
  const by = state.authBy||'phone';
  const key = by==='phone' ? '+993'+$('#a_phone').value.replace(/\D/g,'') : $('#a_email').value.trim().toLowerCase();
  const f = S.fails[key] || {n:0,until:0};
  if (f.until > Date.now()) return err.textContent = `Слишком много попыток. Подождите ${Math.ceil((f.until-Date.now())/6e4)} мин.`;
  const phone = by==='phone' ? key : (await sb.rpc('mb_phone_for_email', {p_email:key})).data;
  const ok = phone && !(await sb.auth.signInWithPassword({email:loginOf(phone), password:$('#a_pw').value})).error;
  if (ok){ await refresh(); await ensureProfile(); }
  const u = me();
  if (!ok || !u){ f.n++; if (f.n>=5){ f.until=Date.now()+5*6e4; f.n=0; } S.fails[key]=f; persist(); return err.textContent = f.until>Date.now() ? 'Вход заблокирован на 5 минут после 5 ошибок' : `Неверный ${by==='phone'?'номер':'адрес'} или пароль. Осталось попыток: ${5-f.n}`; }
  if (u.blocked){ await sb.auth.signOut(); await refresh(); return err.textContent='Аккаунт заблокирован. Напишите в поддержку.'; }
  delete S.fails[key]; persist(); deviceOn(); toast(`Здравствуйте, ${u.name}`); afterAuth();
}

async function publish(){
  if (state.publishing) return;
  const u = me(), d = state.draft, err = $('#d_err'); err.textContent='';
  const sec = d.sec, specs = {...d.specs};
  d.title = $('#d_title').value.trim(); d.desc = $('#d_desc').value.trim(); d.reg = $('#d_reg').value; d.place = $('#d_place').value;
  if ($('#d_price')) d.price = $('#d_price').value; if ($('#d_unit')) d.unit = $('#d_unit').value;
  if (d.title.length<5) return err.textContent='Заголовок: минимум 5 символов';
  for (const f of FIELDS[sec]) if (f.req && !specs[f.k]) return err.textContent=`Заполните поле «${f.l}»`;
  if (['year'].some(k=>specs[k] && (specs[k]<1950 || specs[k]>new Date().getFullYear()+1))) return err.textContent='Проверьте год выпуска';
  let price = Number(d.price)||0;
  if (sec==='import'){ price = (Number(specs.pCar)||0)+(Number(specs.pShip)||0)+(Number(specs.pCust)||0); if (!price) return err.textContent='Укажите цену авто, доставки и растаможки'; }
  if (['cars','parts','rent'].includes(sec) && !price) return err.textContent='Укажите цену';
  for (const k of ['year','km','engine','exp','eta','pCar','pShip','pCust']) if (specs[k]) specs[k] = Number(specs[k]);
  const seek = sec==='jobs' && specs.kind==='seek';
  // Фото загружаем в общее хранилище, в объявлении остаются только ссылки
  let photos;
  state.publishing = true; err.textContent = d.photos.length ? 'Загружаем фото…' : '';
  try { photos = await Promise.all(d.photos.map(uploadPhoto)); }
  catch { return err.textContent = 'Не удалось загрузить фото. Проверьте интернет и попробуйте ещё раз.'; }
  finally { state.publishing = false; }
  err.textContent = '';
  const l = {id:uid(),sec,uid:u.id,title:d.title,price,unit:d.unit||'',reg:d.reg||REGIONS[0].k,place:d.place||'',specs,desc:d.desc,photos,created:now(),views:0,likes:[],dislikes:[],
    art:{k:({cars:'sedan',import:'sedan',rent:'sedan',parts:'gear',sto:'wrench',jobs:'job'})[sec] || (/(кран)/i.test(specs.ttype||'')?'crane':/реф/i.test(specs.ttype||'')?'fridge':'truck'), c:['#7c6cf0','#e67e22','#16a085','#2e86de','#c0392b'][Math.floor(Math.random()*5)]}};
  const flags = botCheck(d.title+' '+d.desc, u, l);
  let msg;
  const mode = S.settings.mode;
  if (seek){ l.until=now()+30*DAY; l.status='active'; msg='Резюме опубликовано бесплатно на 30 дней'; }
  else if (mode==='free'){ l.until=now()+30*DAY; l.status='active'; l.free=1; msg='Опубликовано бесплатно на 30 дней'; }
  else if (!u.freeUsed){ l.until=now()+7*DAY; l.status='active'; u.freeUsed=true; l.free=1; msg='Опубликовано бесплатно на 7 дней'; }
  else { const sub=freeSlot(u,sec); if (sub){ l.until=sub.until; l.subId=sub.id; l.status='active'; msg='Опубликовано по подписке'; } else { l.until=now(); l.status='nosub'; msg='Сохранено. Объявление включится после оплаты подписки'; } }
  if (flags.length){ l.flags=flags; l.prev=l.status; l.status='review'; msg='Отправлено на проверку модератору: '+flags.join(', ').toLowerCase(); }
  S.listings.push(l); persist();
  state.draft=null; toast(msg);
  if (l.status==='nosub' && mode==='per'){ stack=[{name:'profile'}]; state.order = newOrder({kind:'listing', lid:l.id, amount:perPrice(u)}); state.payMethod='tm'; go('pay'); }
  else if (l.status==='nosub'){ stack=[{name:'profile'}]; go('plans', sec); } else { stack=[{name:'home'}]; go('detail', l.id); }
}

function activatePayment(p){
  p.status='done';
  const u = userById(p.uid);
  if (p.kind==='sub'){
    const base = S.subs.filter(s=>s.uid===p.uid && s.sec===p.sec && s.acct===p.acct && s.tier===p.tier && s.status==='active' && s.until>now()).sort((a,b)=>b.until-a.until)[0];
    const start = base ? base.until : now();
    const sub = {id:uid(),uid:p.uid,sec:p.sec,acct:p.acct,tier:p.tier,status:'active',until:start+p.months*30*DAY};
    S.subs.push(sub);
    let slots = planOf(p.sec, p.acct).tiers[p.tier].slots;
    const secs = p.sec==='cars' ? ['cars','import','rent'] : [p.sec];
    S.listings.filter(l=>l.uid===p.uid && secs.includes(l.sec) && ['nosub','expired'].includes(l.status)).sort((a,b)=>b.created-a.created)
      .forEach(l=>{ if (slots-->0){ l.status='active'; l.until=sub.until; l.subId=sub.id; l.remind=0; } });
    notify(p.uid, `Оплата ${p.code} подтверждена. Подписка «${tierName(p)}» активна до ${dateStr(sub.until)}.`);
  } else if (p.kind==='listing'){
    const l = S.listings.find(x=>x.id===p.lid);
    if (l){ l.status='active'; l.until=Math.max(l.until,now())+30*DAY; l.remind=0; notify(p.uid, `Оплата ${p.code} подтверждена. «${l.title}» опубликовано на 30 дней.`); }
  } else {
    const l = S.listings.find(x=>x.id===p.lid); const pr = PROMOS.find(x=>x.k===p.promo);
    if (l){ l[pr.k] = Math.max(l[pr.k]||0, now()) + pr.days*DAY; if (pr.k==='top') l.created = now(); }
    notify(p.uid, `Оплата ${p.code} подтверждена. «${pr.n}» включено.`);
  }
}

  atab(v){ state.admTab=v; go('admin', v, true); },
  aok(v){ activatePayment(S.payments.find(p=>p.id===v)); persist(); toast('Подписка активирована'); render(); },
  ano(v){ const p=S.payments.find(x=>x.id===v); p.status='rejected'; notify(p.uid,`Оплата ${p.code} не найдена. Проверьте номер и сумму или напишите в поддержку.`); persist(); render(); },
  lok(v){ const l=S.listings.find(x=>x.id===v); l.status = l.prev && l.prev!=='review' ? l.prev : 'active'; if (l.until<=now()) l.until=now()+7*DAY; l.flags=[]; notify(l.uid,`Объявление «${l.title}» прошло проверку`); persist(); render(); },
  lno(v){ const l=S.listings.find(x=>x.id===v); l.status='rejected'; notify(l.uid,`Объявление «${l.title}» отклонено модератором`); persist(); render(); },
  cdismiss(v){ const [,id]=v.split(':'); S.complaints=S.complaints.filter(c=>c.target!==id); const l=S.listings.find(x=>x.id===id); if(l) l.hiddenByComplaints=false; const c=S.comments.find(x=>x.id===id); if(c) c.hidden=false; persist(); render(); },
  cdel(v){ const [type,id]=v.split(':'); if (type==='listing') S.listings=S.listings.filter(l=>l.id!==id); else S.comments=S.comments.filter(c=>c.id!==id); S.complaints=S.complaints.filter(c=>c.target!==id); persist(); toast('Удалено'); render(); },
  ban(v){ const x=userById(v); x.blocked=!x.blocked; S.listings.forEach(l=>{ if(l.uid===v) l.hiddenByComplaints = x.blocked; }); persist(); toast(x.blocked?'Пользователь заблокирован':'Блокировка снята'); render(); },
  moder(v){ const x=userById(v); x.role = x.role==='moder'?'user':'moder'; persist(); render(); },
  async resetpw(v){ const x=userById(v); const np = 'mb'+Math.floor(100000+Math.random()*900000);
    const {error} = await sb.rpc('mb_reset_password', {p_user:x.id, p_password:np}); if (error){ toast('Не удалось сбросить пароль: '+error.message); return; }
    openSheet(`<h2>Новый пароль для ${esc(x.name)}</h2><div class="copy-row"><b class="num phone-num">${np}</b><button class="btn sm ghost" data-a="copy" data-v="${np}">${ic('copy')}</button></div><p class="small dim" style="margin:0">Сообщите его пользователю и попросите сменить после входа.</p><button class="btn" data-a="closesheet">Готово</button>`); },
  setmode(v){ S.settings.mode=v; persist(); toast('Режим: '+MODE_TEXT[v]); render(); },
  saveset(){ const st=S.settings; st.rub=Number($('#s_rub').value)||st.rub; st.perPerson=Math.max(0,Number($('#s_pp').value)||0); st.perCompany=Math.max(0,Number($('#s_pc').value)||0); st.tmNumber=$('#s_tm').value.trim()||st.tmNumber; st.rubNumber=$('#s_rf').value.trim()||st.rubNumber; persist(); toast('Сохранено'); render(); },
  async reload(){ await refresh(); toast('Данные обновлены'); render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (e.target.id==='sheet'){ closeSheet(); return; }
  if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.getAttribute('type')==='submit') return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset.v, el);
});
document.addEventListener('keydown', e => { if (e.key==='Escape') back(); if ((e.key==='Enter'||e.key===' ') && e.target.matches('.lc')) { e.preventDefault(); A.open(e.target.dataset.v); } });

(async function start(){
  let local = {};
  try { local = JSON.parse(localStorage.getItem(LS)) || {}; } catch {}
  try { localStorage.removeItem('mb_store_v1'); } catch {}   // старые демо-данные прототипа
  S = {users:[], listings:[], comments:[], complaints:[], payments:[], subs:[], notifs:[], session:null,
    favs:local.favs||{}, fails:local.fails||{}, settings:{...DEFAULT_SETTINGS, theme:local.theme||'night', lang:local.lang||'ru'}};
  LANG = S.settings.lang;
  document.body.dataset.t = S.settings.theme;
  render();
  try { await pull(); await ensureProfile(); tick(); } catch (e){ console.warn(e); toast('Нет связи с сервером. Проверьте интернет.'); }
  render();
  deviceOn();
  if (NB && NB.openedFromNotif()) notifSheet();
  // Вернулись в приложение — подтягиваем свежие объявления
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || !$('#sheet').hidden || ['post','auth','pay'].includes(stack[stack.length-1]?.name)) return;
    try { await refresh(); render(); } catch {}
  });
})();
</script>
</body></html>
