name: Сайт и веб-версия

# Сайт (docs/) + веб-версия приложения (тот же код, что в APK) по адресу /Planner/app/
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mashyn/src/main/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт и веб-версию
        run: |
          mkdir -p _site/app
          cp -r docs/. _site/
          cp -r mashyn/src/main/assets/. _site/app/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
